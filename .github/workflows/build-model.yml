name: build-model
on:
  workflow_dispatch:
    inputs:
      memo:
        description: why this run
        required: true
      check_fetch:
        description: also fetch 2026-09-21..27 from Savant and require it to equal the Kaggle file
        type: boolean
        default: false
  schedule:
    - cron: "23 11 * * *"   # daily; does nothing outside March to September
permissions:
  contents: write
concurrency:
  group: build-model
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DS: yasunorim/mlb-statcast-bat-tracking-2024-2025
    steps:
      - name: Season guard
        id: guard
        run: |
          y=$(date -u +%Y); m=$(date -u +%-m)
          # regular season = March to September; from October the served season is next year
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$m" -lt 3 ] || [ "$m" -gt 10 ]; }; then
            echo "off season; nothing to do"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$m" -ge 10 ]; then s=$((y + 1)); else s=$y; fi
          # fetch the season being played (March to October; the regular season can end in early October)
          if [ "$m" -ge 3 ] && [ "$m" -le 10 ]; then live=true; f=$y; else live=false; f=$y; fi
          echo "serve=$s" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "fetch=$f" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Data
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p data
          for y in 2024 2025 2026; do
            kaggle datasets download "$DS" -f statcast_$y.parquet -p data
            if [ -f data/statcast_$y.parquet.zip ]; then unzip -o -q data/statcast_$y.parquet.zip -d data; fi
          done
          S=${{ steps.guard.outputs.serve }}
          # seasons after 2026 come from Savant, cached as release assets data-<season>
          for y in $(seq 2027 "$S"); do
            gh release download "data-$y" -p "statcast_$y.parquet" -D data 2>/dev/null || true
          done
          F=${{ steps.guard.outputs.fetch }}
          if [ "${{ steps.guard.outputs.live }}" = "true" ] && [ "$F" -ge 2027 ]; then
            BASE=""; [ -f "data/statcast_$F.parquet" ] && BASE="--base ../data/statcast_$F.parquet"
            (cd src && python fetch_savant.py "$F" "../data/statcast_$F.parquet" $BASE)
            gh release view "data-$F" >/dev/null 2>&1 || gh release create "data-$F" --title "Season $F pitches (Savant)" --notes "Cache for the in-season build."
            gh release upload "data-$F" "data/statcast_$F.parquet" --clobber
          fi
          ARGS=""
          for f in data/statcast_*.parquet; do y=$(basename "$f" .parquet | cut -d_ -f2); ARGS="$ARGS $y=../$f"; done
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "$ARGS"
      - name: Savant fetch equals Kaggle
        if: steps.guard.outputs.run == 'true' && inputs.check_fetch
        run: cd src && python fetch_savant.py --check 2026 ../data/statcast_2026.parquet 2026-09-21 2026-09-27
      - name: Build and gate
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p current out
          CUR=""
          if gh release download model-latest -p model.json.gz -p meta.json -D current 2>/dev/null; then CUR="--current ../current"; fi
          cd src && python build_serving.py ../out ${{ steps.guard.outputs.serve }} $ARGS $CUR
      - name: Keep the gate record
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          for f in out/meta.json out/gates.json; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true
      - name: Publish (model and state first, meta last)
        if: steps.guard.outputs.run == 'true'
        run: |
          gh release view model-latest >/dev/null 2>&1 || gh release create model-latest --title "Served model" --notes "Model and state used by the API; replaced by the build-model workflow."
          gh release upload model-latest out/model.json.gz out/state.json.gz --clobber
          gh release upload model-latest out/meta.json --clobber
          if [ "$(python -c "import json; print(json.load(open('out/meta.json'))['new_model'])")" = "True" ]; then
            tag="model-$(date -u +%Y%m%d)"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "A newly adopted model (passed the hold-out gate)." out/model.json.gz out/state.json.gz out/meta.json
          fi
